<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>serverGitUpdater</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1>serverGitUpdater</h1>
    <div class="topbar-right">
      <span id="who" class="muted"></span>
      <button id="logout" class="ghost">Sign out</button>
    </div>
  </header>

  <main class="grid">
    <section class="card">
      <h2>Repository</h2>
      <dl class="kv">
        <dt>Path</dt><dd id="s-path">—</dd>
        <dt>Branch</dt><dd id="s-branch">—</dd>
        <dt>Remote</dt><dd id="s-remote">—</dd>
        <dt>HEAD</dt><dd id="s-head">—</dd>
        <dt>Last commit</dt><dd id="s-subject">—</dd>
        <dt>Commit time</dt><dd id="s-time">—</dd>
        <dt>Working tree</dt><dd id="s-dirty">—</dd>
        <dt>Behind / ahead</dt><dd id="s-ba">—</dd>
        <dt>Auto-update</dt><dd id="s-auto">—</dd>
      </dl>
      <div class="row">
        <button id="update-btn" class="primary">Update now</button>
        <button id="refresh-btn" class="ghost">Refresh</button>
      </div>
      <p id="update-status" class="muted"></p>
    </section>

    <section class="card">
      <h2>Settings</h2>
      <form id="config-form">
        <label>Repository path
          <input type="text" name="repo_path" placeholder="/srv/myapp" required>
        </label>
        <div class="two-col">
          <label>Branch
            <input type="text" name="branch" value="main" required>
          </label>
          <label>Remote
            <input type="text" name="remote" value="origin" required>
          </label>
        </div>
        <label>Post-update command
          <input type="text" name="post_update_command" placeholder="/srv/myapp/deploy.sh">
        </label>
        <label>Post-update args (one per line)
          <textarea name="post_update_args" rows="3" placeholder="--restart"></textarea>
        </label>
        <div class="two-col">
          <label class="checkbox">
            <input type="checkbox" name="auto_update_enabled">
            <span>Enable scheduled auto-updates</span>
          </label>
          <label>Interval (minutes)
            <input type="number" name="auto_update_minutes" min="1" value="15" required>
          </label>
        </div>
        <button type="submit" class="primary">Save settings</button>
        <p id="config-status" class="muted"></p>
      </form>
    </section>

    <section class="card">
      <h2>Change password</h2>
      <form id="password-form">
        <label>Current password
          <input type="password" name="current" autocomplete="current-password" required>
        </label>
        <label>New password (min 8 chars)
          <input type="password" name="new" autocomplete="new-password" minlength="8" required>
        </label>
        <button type="submit" class="primary">Update password</button>
        <p id="password-status" class="muted"></p>
      </form>
    </section>

    <section class="card wide">
      <h2>Update history</h2>
      <table id="logs">
        <thead>
          <tr>
            <th>When</th>
            <th>Source</th>
            <th>Result</th>
            <th>Old → New</th>
            <th>Duration</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <details>
        <summary>Raw output (most recent run)</summary>
        <pre id="last-output">—</pre>
      </details>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
